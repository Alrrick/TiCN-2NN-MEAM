[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticn-analysis"
version = "0.1.0"
description = "Explicit and reproducible analysis of archived TiCN simulations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "scipy>=1.10,<2"]

[project.optional-dependencies]
dev = ["ruff==0.14.3", "mypy==1.18.2"]

[project.scripts]
ticn-analyze = "ticn_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src/ticn_analysis"]
strict = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "scipy.*"]
ignore_missing_imports = true
